<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consulting Test Game Trainer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Consulting Assessment Game Trainer</h1>
    <p>Practice-style drills for numerical, verbal, and critical reasoning game formats.</p>
  </header>

  <main>
    <section class="panel">
      <h2>Choose a practice game</h2>
      <div id="game-buttons" class="grid"></div>
      <p class="disclaimer">
        This trainer is an independent practice tool inspired by common assessment mechanics.
        It is not affiliated with any testing provider or consulting firm.
      </p>
    </section>

    <section id="game-area" class="panel hidden"></section>
    <section id="feedback-area" class="panel hidden"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
